name: Run BotBuilders

on:
  workflow_dispatch:
    inputs:
      server_host:
        description: Minecraft server hostname or IP
        required: true
        type: string
      server_port:
        description: Minecraft server port
        required: true
        default: "25565"
        type: string
      bot_username:
        description: "Optional: launch only this bot; leave blank to launch every BOT_CREDENTIALS bot"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Start bot or bot group
        env:
          MC_HOST: ${{ inputs.server_host }}
          MC_PORT: ${{ inputs.server_port }}
          MC_VERSION: "26.1"
          REQUESTED_BOT_USERNAME: ${{ inputs.bot_username }}
          MC_AUTH: ${{ secrets.MC_AUTH }}
          BOT_CREDENTIALS: ${{ secrets.BOT_CREDENTIALS }}
          COMMANDER_USERNAME: ${{ secrets.COMMANDER }}
          BOT_COORDINATOR_USERNAME: ${{ secrets.BOT_COORDINATOR_USERNAME }}
          BOT_GROUP: ${{ secrets.BOT_GROUP }}
        shell: bash
        run: |
          if [ -n "$REQUESTED_BOT_USERNAME" ]; then
            echo "Launching the requested bot."
            MC_USERNAME="$REQUESTED_BOT_USERNAME" npm start
            exit $?
          fi

          if [ -z "$BOT_CREDENTIALS" ]; then
            echo "BOT_CREDENTIALS is empty. Add one username/password pair per line, or enter bot_username to launch one bot."
            exit 1
          fi

          count=0
          while IFS= read -r credential || [ -n "$credential" ]; do
            [ -z "${credential//[[:space:]]/}" ] && continue
            username="${credential%%/*}"
            username="$(printf '%s' "$username" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if [ -z "$username" ] || [ "$username" = "$credential" ]; then
              echo "Invalid BOT_CREDENTIALS line. Use username/password, one bot per line."
              exit 1
            fi
            echo "Starting bot process $((count + 1)) for username: $username"
            MC_USERNAME="$username" npm start &
            count=$((count + 1))
            if [ "$count" -lt 5 ]; then
              echo "Waiting 5 seconds before starting the next bot."
              sleep 5
            fi
          done <<< "$BOT_CREDENTIALS"

          if [ "$count" -eq 0 ]; then
            echo "No bot usernames were found in BOT_CREDENTIALS."
            exit 1
          fi

          echo "Started $count bot process(es). Waiting for them to exit."
          wait
